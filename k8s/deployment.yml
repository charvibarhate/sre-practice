apiVersion: apps/v1
kind: Deployment

metadata:
  name: sre-nginx

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sre-nginx

  template:
    metadata:
      labels:
        app: sre-nginx

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: nginx
          image: ghcr.io/charvibarhate/sre-nginx:IMAGE_TAG
          ports:
            - containerPort: 80