name: Build, Push and Deploy Microservices

on:
  push:
    branches:
      - main
      - phase1
      - microservice

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sre-frontend:${{ github.sha }} ./frontend
          docker push ghcr.io/${{ github.repository_owner }}/sre-frontend:${{ github.sha }}

      - name: Build and push API Gateway image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sre-api-gateway:${{ github.sha }} ./api-gateway
          docker push ghcr.io/${{ github.repository_owner }}/sre-api-gateway:${{ github.sha }}

      - name: Build and push Backend image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/sre-backend:${{ github.sha }} ./backend
          docker push ghcr.io/${{ github.repository_owner }}/sre-backend:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::571841331213:role/GitHubActions-SRE-NGINX
          aws-region: ap-south-1

      - name: Deploy Kubernetes manifests using SSM
        run: |
          # Replace IMAGE_TAG in all manifests with this commit SHA
          sed "s|IMAGE_TAG|${{ github.sha }}|g" k8s-microservices/frontend-deployment.yml > frontend-deployment-rendered.yml
          sed "s|IMAGE_TAG|${{ github.sha }}|g" k8s-microservices/api-gateway-deployment.yml > api-gateway-deployment-rendered.yml
          sed "s|IMAGE_TAG|${{ github.sha }}|g" k8s-microservices/backend-deployment.yml > backend-deployment-rendered.yml

          # Apply each service separately to avoid YAML parsing issues
          jq -n --arg frontend "$(base64 -w 0 frontend-deployment-rendered.yml)" --arg frontend_svc "$(base64 -w 0 k8s-microservices/frontend-service.yml)" --arg gateway "$(base64 -w 0 api-gateway-deployment-rendered.yml)" --arg gateway_svc "$(base64 -w 0 k8s-microservices/api-gateway-service.yml)" --arg backend "$(base64 -w 0 backend-deployment-rendered.yml)" --arg backend_svc "$(base64 -w 0 k8s-microservices/backend-service.yml)" '{
            commands: [
              "echo \($frontend) | base64 -d > /tmp/frontend.yml",
              "echo \($frontend_svc) | base64 -d > /tmp/frontend-svc.yml",
              "sudo kubectl apply -f /tmp/frontend.yml",
              "sudo kubectl apply -f /tmp/frontend-svc.yml",
              "echo \($gateway) | base64 -d > /tmp/gateway.yml",
              "echo \($gateway_svc) | base64 -d > /tmp/gateway-svc.yml",
              "sudo kubectl apply -f /tmp/gateway.yml",
              "sudo kubectl apply -f /tmp/gateway-svc.yml",
              "echo \($backend) | base64 -d > /tmp/backend.yml",
              "echo \($backend_svc) | base64 -d > /tmp/backend-svc.yml",
              "sudo kubectl apply -f /tmp/backend.yml",
              "sudo kubectl apply -f /tmp/backend-svc.yml",
              "echo \"Deployment completed. Check status with: sudo kubectl get pods\""
            ]
          }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0fe6a8a4605c22787 \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"