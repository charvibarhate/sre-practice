apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  labels:
    app: api-gateway
    tier: gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway
        tier: gateway

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: api-gateway
          image: ghcr.io/charvibarhate/sre-api-gateway:IMAGE_TAG
          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_URL
              value: "http://backend-service:5000"

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3